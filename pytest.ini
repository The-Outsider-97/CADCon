[pytest]
# CADCon is a git submodule of SLAI, whose root and applications/ folders are
# Python packages. Under the default "prepend" import mode pytest then climbs
# above CADCon and puts SLAI's parent on sys.path, so `slai` resolves to the
# SLAI checkout instead of CADCon's own slai/ package. importlib mode plus an
# explicit pythonpath keeps collection identical in the standalone and the
# submodule layouts.
addopts = --import-mode=importlib
pythonpath = .
testpaths = tests
